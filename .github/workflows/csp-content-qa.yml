name: Hospital static contact disclosure checks
on:
  pull_request:
    paths:
      - 'contact.html'
      - 'home.html'
      - 'tests/test_contact_disclosure.py'
      - '.github/workflows/csp-content-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run source disclosure regression checks
        run: python3 -m unittest discover -s tests -p 'test_contact_disclosure.py' -v
